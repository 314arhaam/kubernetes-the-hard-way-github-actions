name: Provision k8s - The hard way

on:
  workflow_dispatch:
    inputs:
      masters:
        description: "Number of control-plane nodes"
        required: true
        default: "1"
        type: number
      workers:
        description: "Number of worker nodes"
        required: true
        default: "2"
        type: number
      keep:
        description: "Keep cluster alive"
        required: true
        type: boolean
        default: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04

    outputs:
      servers: ${{ steps.set-matrix.outputs.servers }}
      workers: ${{ steps.set-matrix.outputs.workers }}

    steps:
      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          master_count=${{ inputs.masters }}
          worker_count=${{ inputs.workers }}
          [ "$master_count" -gt 0 ] && [ "$master_count" -le 256 ]
          [ "$worker_count" -gt 0 ] && [ "$worker_count" -le 256 ]

          servers=$(python3 -c "import json; print(json.dumps([{'name': f'server-{i}'} for i in range($master_count)]))")
          workers=$(python3 -c "import json; print(json.dumps([{'name': f'node-{i}'} for i in range($worker_count)]))")
          echo "servers=$servers" >> "$GITHUB_OUTPUT"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"

  redis-service:
    name: Redis lifecycle coordinator
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Connect Redis to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: redis-server-ts

      - name: Register the Redis coordinator
        run: docker exec ${{ job.services.redis.id }} redis-cli SET redis-service ready

      - name: Keep Redis online until verification finishes
        shell: bash
        run: |
          while [ "$(docker exec ${{ job.services.redis.id }} redis-cli GET redis-service)" = "ready" ]; do
            sleep 2
          done

  check-redis-service:
    name: Check Redis service
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: check-redis-service

      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes redis-tools

      - name: Wait for Redis
        shell: bash
        run: |
          MAX_RETRIES=60
          COUNT=0
          REDIS_HOST="redis-server-ts"

          while true; do
            REDIS_HOST="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"

            if [ -n "$REDIS_HOST" ]; then
              echo "Checking Redis at ${REDIS_HOST}:6379..."
              RESPONSE="$(redis-cli -h "$REDIS_HOST" -p 6379 ping 2>/dev/null || true)"

              if [ "$RESPONSE" = "PONG" ]; then
                echo "Redis is available."
                break
              fi
            fi

            COUNT=$((COUNT + 1))

            if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
              echo "Timeout waiting for Redis."
              exit 1
            fi

            echo "Redis is not available yet. ($COUNT/$MAX_RETRIES)"
            sleep 2
          done
  
  servers:
    name: ${{ matrix.node.name }}

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.prepare-matrix.outputs.servers) }}
    
    runs-on: ubuntu-22.04
    needs:
      - check-redis-service
      - prepare-matrix
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch }}
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ matrix.node.name }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: Install the Redis client
      run: |
        sudo apt-get update
        sudo apt-get install --yes redis-tools
    - name: Register resource and wait for verification
      shell: bash
      run: |
        hostname=${{ matrix.node.name }}
        redis_host="redis-server-ts"

        until [ "$(redis-cli -h "$redis_host" ping 2>/dev/null || true)" = PONG ]; do
          sleep 2
        done

        redis-cli -h "$redis_host" HSET masters "$hostname" "$(tailscale ip -4)"

        while [ "$(redis-cli -h "$redis_host" HEXISTS masters "$hostname")" = 1 ]; do
          echo "control plane available: $hostname - $(date)"
          sleep 2
        done
  
  workers:
    name: ${{ matrix.node.name }}

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.prepare-matrix.outputs.workers) }}
    
    runs-on: ubuntu-22.04
    needs: 
      - check-redis-service
      - prepare-matrix
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch }}
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ matrix.node.name }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: Install the Redis client
      run: |
        sudo apt-get update
        sudo apt-get install --yes redis-tools
    - name: Register resource and wait for verification
      shell: bash
      run: |
        hostname=${{ matrix.node.name }}
        redis_host="redis-server-ts"

        until [ "$(redis-cli -h "$redis_host" ping 2>/dev/null || true)" = PONG ]; do
          sleep 2
        done

        redis-cli -h "$redis_host" HSET workers "$hostname" "$(tailscale ip -4)"

        while [ "$(redis-cli -h "$redis_host" HEXISTS workers "$hostname")" = 1 ]; do
          echo "worker available: $hostname - $(date)"
          sleep 2
        done

  check-kubernetes-resources:
    runs-on: ubuntu-22.04
    needs: check-redis-service
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch }}
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: Install the Redis client
      run: |
        sudo apt-get update
        sudo apt-get install --yes redis-tools
    - name: Register resource and wait for verification
      shell: bash
      run: |
        redis_host="redis-server-ts"
        expected_masters=${{ inputs.masters }}
        expected_workers=${{ inputs.workers }}

        until [ "$(redis-cli -h "$redis_host" HLEN masters)" -eq "$expected_masters" ] \
          && [ "$(redis-cli -h "$redis_host" HLEN workers)" -eq "$expected_workers" ]; do
          echo "Waiting for machine inventory... $(date)"
          sleep 2
        done

        echo "Control-plane inventory:"
        redis-cli -h "$redis_host" HGETALL masters
        echo "Worker inventory:"
        redis-cli -h "$redis_host" HGETALL workers

  jumpbox:
    runs-on: ubuntu-22.04
    needs: check-kubernetes-resources
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch }}
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: KTHW step 2
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 02-jumpbox.sh
        sudo ./02-jumpbox.sh
    - name: KTHW step 3
      shell: bash
      working-directory: ./scripts
      env:
        REDIS_HOST: redis-server-ts
      run: |
        sudo chmod +x 03-compute-resources.sh
        sudo --preserve-env=REDIS_HOST ./03-compute-resources.sh
    - name: KTHW step 4
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 04-certificate-authority.sh #05-kubernetes-configuration-files
        sudo ./04-certificate-authority.sh
    - name: KTHW step 5
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 05-kubernetes-configuration-files.sh
        sudo ./05-kubernetes-configuration-files.sh
    - name: KTHW step 6
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 06-data-encryption-keys.sh
        sudo ./06-data-encryption-keys.sh
    - name: KTHW step 7
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 07-bootstrapping-etcd.sh
        sudo ./07-bootstrapping-etcd.sh
    - name: KTHW step 8
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 08-bootstrapping-kubernetes-controllers.sh
        sudo ./08-bootstrapping-kubernetes-controllers.sh
    - name: KTHW step 9
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 09-bootstrapping-kubernetes-workers.sh
        sudo ./09-bootstrapping-kubernetes-workers.sh
    - name: KTHW step 10
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 10-configuring-kubectl.sh
        sudo ./10-configuring-kubectl.sh
    - name: KTHW step 11
      shell: bash
      working-directory: ./scripts
      run: |
        sudo chmod +x 11-pod-network-routes.sh
        sudo ./11-pod-network-routes.sh
    - name: Check kubelet on workers
      shell: bash
      working-directory: ./scripts/kubernetes-the-hard-way
      run: |
        while read -r host; do
          sudo ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "root@$host" \
            "systemctl status kubelet --no-pager -l"
        done < workers.txt
    - name: kubectl test
      run: |
        sleep 30
        sudo kubectl version
        sudo kubectl get nodes -o wide
    - name: Create cluster secret
      run: |
        sudo kubectl create secret generic kubernetes-the-hard-way --from-literal="mykey=mydata"
    - name: Create NginX deployment
      run: |
        sudo kubectl create deployment nginx --image=nginx:latest
    - name: Check NginX pod and get version
      run: |
        sleep 10
        sudo kubectl get pods -A
        POD_NAME=$(sudo kubectl get pods -l app=nginx -o jsonpath="{.items[0].metadata.name}")
        sleep 30
        sudo kubectl exec -ti $POD_NAME -- nginx -v
    - name: Port forward NginX
      run: | 
        POD_NAME=$(sudo kubectl get pods -l app=nginx -o jsonpath="{.items[0].metadata.name}")
        sudo kubectl port-forward $POD_NAME 8080:80 &
    - name: cURL test on NginX
      run: |
        for i in {1..5}; do
          curl --head http://127.0.0.1:8080;
          sleep 3
        done
    - name: get NginX logs to see cURLs
      run: |
        POD_NAME=$(sudo kubectl get pods -l app=nginx -o jsonpath="{.items[0].metadata.name}")
        sudo kubectl logs $POD_NAME
    - name: Install the Redis client
      if: ${{ inputs.keep }}
      run: |
        sudo apt-get update
        sudo apt-get install --yes redis-tools
    - name: Register resource and wait for verification
      if: ${{ inputs.keep }}
      shell: bash
      run: |
        redis_host="redis-server-ts"

        until [ "$(redis-cli -h "$redis_host" ping 2>/dev/null || true)" = PONG ]; do
          sleep 2
        done

        redis-cli -h "$redis_host" SET jumpbox ready

        while [ "$(redis-cli -h "$redis_host" GET redis-service)" = "ready" ]; do
          echo "jumpbox available: $(date)"
          sleep 2
        done

  clean-up:
    runs-on: ubuntu-22.04
    needs: jumpbox
    if: always()
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        ref: ${{ inputs.branch }}
    - name: Setup node
      uses: ./.github/actions/setup-node-with-tailscale
      with:
        node-name: ${{ github.job }}
        ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
    - name: Install the Redis client
      run: |
        sudo apt-get update
        sudo apt-get install --yes redis-tools
    - name: Remove lifecycle keys and release all jobs
      shell: bash
      run: |
        redis_host="redis-server-ts"

        while [ -z "$redis_host" ]; do
          redis_host="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "redis-server-ts") | .TailscaleIPs[0]' | head -n1)"
          [ -n "$redis_host" ] || sleep 2
        done

        echo "Releasing k8s cluster..."

        redis-cli -h "$redis_host" DEL workers masters redis-service
        
        echo "k8s resources removed"
